modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/yofred09/just-compatible/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/yofred09/just-compatible"
authors="Yo_Fred"
description='''
Server-side compatibility, diagnostics, and safe migration framework for modded multiworld servers.
'''

[[mixins]]
config="justcompatible.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="justcore"
type="required"
versionRange="[0.2.0,)"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="waystones"
type="optional"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="vinery"
type="optional"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="starcatcher"
type="optional"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="bountifulbaubles"
type="optional"
ordering="AFTER"
side="SERVER"
